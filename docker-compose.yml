services:
  postgres:
    image: postgres:16
    container_name: notebooklm_pg
    restart: always
    environment:
      POSTGRES_USER: notebook
      POSTGRES_PASSWORD: notebook
      POSTGRES_DB: notebooklm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: notebooklm_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./backend/qdrant_data:/qdrant/storage:z

  redis:
    image: redis:7-alpine
    container_name: notebooklm_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  pgdata:
